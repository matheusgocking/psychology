<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mapa do Lastro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#141211">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout (desenho do Matheus, 21/10/2026): barra com Início e Integrantes à esquerda, Calendário e o perfil à direita.
   O Início é a árvore dos projetos: projetos em cima, frentes embaixo, ligados por linhas. Cada coisa abre em tela própria.
   Identidade do Clube Lastro (nota Identidade Visual - Lastro): papel, vinho, mostarda, ameixa, tinta e ouro escuro.
   Acabamento de 24/10/2026 (pedido dele: "muito vinho", barra e fonte estranhas, claro e escuro à escolha): o vinho ficou só na marca e no destaque
   do tema claro; a barra é da cor da página; fundo escuro neutro e quente, da tinta; IBM Plex Sans na interface, Libre Caslon Display nos títulos
   e Libre Caslon Text na leitura das notas. Mostarda nunca vira texto sobre papel. */
:root {
  --bg: #F6F1E7; --panel: #EFE8DB; --raised: #FFFDF8; --line: #E3D9C7; --line-strong: #CDBFA8;
  --fg: #1E1A17; --muted: #5E544B; --faint: #776C61; --dot: #DDD3C1;
  --accent: #6E1E2B; --accent-soft: color-mix(in oklch, #6E1E2B 9%, transparent); --on-accent: #F6F1E7;
  --c-red: #9E2F3A; --c-orange: #A35A26; --c-yellow: #946D1F; --c-green: #5E6E35; --c-cyan: #3F6A62; --c-purple: #5B3560; --c-pink: #8F3F60; --c-gray: #7A6B5D;
  --ok: #4D7042; --warn: #95680F; --bad: #A8322E;
  --shadow: 0 1px 2px rgba(30,26,23,.05), 0 4px 14px rgba(30,26,23,.06);
  --font: "IBM Plex Sans", system-ui, "Segoe UI", sans-serif;
  --display: "Libre Caslon Display", "Libre Caslon Text", Georgia, serif;
  --leitura: "Libre Caslon Text", Georgia, serif;
  --r-s: 4px; --r-m: 8px; --r-l: 12px;
  --fds-bg: #EEE6D6; --fds-line: #DDD1BC; --quente-bg: #F5E2AE; --quente-fg: #5E400B; --quente-line: #E2B53E; --chip: #E9E0CF;
  --bar: #FFFDF8; --bar-fg: #1E1A17; --bar-muted: #5E544B; --bar-line: #E3D9C7; --miolo: #E2B53E; --anel: #6E1E2B; --sel: #6E1E2B;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141211; --panel: #1A1715; --raised: #211D1A; --line: #2E2925; --line-strong: #433C36;
  --fg: #EDE5D8; --muted: #B8AD9F; --faint: #918678; --dot: #29241F;
  --accent: #E2B53E; --accent-soft: color-mix(in oklch, #E2B53E 13%, transparent); --on-accent: #1E1A17;
  --c-red: #D9898B; --c-orange: #DDA172; --c-yellow: #E2B53E; --c-green: #AEBF84; --c-cyan: #93B8AE; --c-purple: #C2A0C8; --c-pink: #D99CB2; --c-gray: #AB9C8E;
  --ok: #9DBE8A; --warn: #E2B53E; --bad: #E8746E;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.3);
  --fds-bg: #181513; --fds-line: #2A2521; --quente-bg: #3A2C12; --quente-fg: #F0CF7A; --quente-line: #6A5220; --chip: #2A2521; --anel: #F3EAD8;
  --bar: #141211; --bar-fg: #EDE5D8; --bar-muted: #B8AD9F; --bar-line: #2E2925; --sel: #E2B53E;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #141211; --panel: #1A1715; --raised: #211D1A; --line: #2E2925; --line-strong: #433C36;
  --fg: #EDE5D8; --muted: #B8AD9F; --faint: #918678; --dot: #29241F;
  --accent: #E2B53E; --accent-soft: color-mix(in oklch, #E2B53E 13%, transparent); --on-accent: #1E1A17;
  --c-red: #D9898B; --c-orange: #DDA172; --c-yellow: #E2B53E; --c-green: #AEBF84; --c-cyan: #93B8AE; --c-purple: #C2A0C8; --c-pink: #D99CB2; --c-gray: #AB9C8E;
  --ok: #9DBE8A; --warn: #E2B53E; --bad: #E8746E;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.3);
  --fds-bg: #181513; --fds-line: #2A2521; --quente-bg: #3A2C12; --quente-fg: #F0CF7A; --quente-line: #6A5220; --chip: #2A2521; --anel: #F3EAD8;
  --bar: #141211; --bar-fg: #EDE5D8; --bar-muted: #B8AD9F; --bar-line: #2E2925; --sel: #E2B53E;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--font); touch-action: manipulation; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
h1, .dialog h2, .esc-nome, .ntitle, .range { font-family: var(--display); font-weight: 400; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* barra */
/* barra da cor da página, com uma linha fina embaixo: a marca fala sozinha, sem a faixa vinho (24/10/2026) */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: stretch; gap: 8px; background: color-mix(in oklch, var(--bar) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--bar-fg); border-bottom: 1px solid var(--bar-line); padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); min-height: 60px; }
/* assinatura horizontal: ícone | LASTRO, descritor em itálico embaixo; anéis vinho no claro e papel no escuro, miolo mostarda */
.marca { display: flex; align-items: center; gap: 11px; border: 0; background: none; color: var(--bar-fg); padding: 0 14px 0 0; margin-right: 10px; text-align: left; }
.marca svg { width: 32px; height: 32px; flex: none; color: var(--anel); }
.marca .mk { display: grid; line-height: 1.05; }
.marca .mk b { font-family: var(--display); font-weight: 400; font-size: 21px; letter-spacing: .14em; }
.marca .mk i { font-family: var(--leitura); font-size: 11.5px; color: var(--bar-muted); white-space: nowrap; margin-top: 2px; }
.nav { display: flex; align-items: stretch; gap: 2px; }
.nav button { position: relative; border: 0; background: none; padding: 0 13px; color: var(--bar-muted); display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 500; letter-spacing: .005em; }
.nav button:hover { color: var(--bar-fg); }
.nav button[aria-current="page"] { color: var(--bar-fg); }
.nav button[aria-current="page"]::before { content: ""; position: absolute; left: 13px; right: 13px; bottom: -1px; height: 2px; border-radius: 2px 2px 0 0; background: var(--sel); }
.nav svg { display: none; width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
/* tema: chave com sol e lua sempre à vista; o lado aceso é o tema que está valendo */
.tema { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 99px; background: var(--panel); border: 1px solid var(--bar-line); }
.tema button { width: 30px; height: 30px; border-radius: 50%; border: 0; background: none; color: var(--bar-muted); display: grid; place-items: center; padding: 0; }
.tema button:hover { color: var(--bar-fg); }
.tema button[aria-pressed="true"] { background: var(--raised); color: var(--bar-fg); box-shadow: 0 1px 2px rgba(0,0,0,.18); }
.tema svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.cal-btn { position: relative; display: inline-flex; align-items: center; gap: 7px; border: 0; background: none; color: var(--bar-muted); padding: 0 6px; height: 100%; font-size: 14.5px; font-weight: 500; }
.cal-btn:hover { color: var(--bar-fg); }
.cal-btn[aria-current="page"] { color: var(--bar-fg); }
.cal-btn[aria-current="page"]::before { content: ""; position: absolute; left: 6px; right: 6px; bottom: -1px; height: 2px; border-radius: 2px 2px 0 0; background: var(--sel); }
.me-btn { border: 0; background: none; padding: 0; border-radius: 50%; display: grid; }
.me-btn .av { border-color: var(--bar); }
.me-btn[aria-current="page"] .av { box-shadow: 0 0 0 2px var(--sel); }
.top .nav button[data-n]:not([data-n=""])::after { background: var(--miolo); color: #1E1A17; }

/* avatares */
.av { --s: 28px; width: var(--s); height: var(--s); border-radius: 50%; display: inline-grid; place-items: center; font-size: calc(var(--s) * .38); font-weight: 600; color: #fff; background: hsl(var(--h) 42% 46%); flex: none; overflow: hidden; box-sizing: border-box; border: 2px solid var(--raised); }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.stack { display: inline-flex; align-items: center; }
.stack .av + .av { margin-left: -9px; }
.more { margin-left: 6px; font-size: 13px; color: var(--muted); }

.screen { padding-block: 28px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
/* uma largura só para todas as telas (antes 1000, 1200 e 1280, e o título pulava de lugar); a árvore do Início usa mais */
.wrap { max-width: 1200px; margin: 0 auto; }
h1 { font-size: 32px; line-height: 1.15; margin: 0 0 8px; text-wrap: balance; }
.lede { color: var(--muted); margin: 0 0 20px; max-width: 62ch; }
.back { border: 0; background: none; color: var(--muted); padding: 4px 0; margin-bottom: 14px; font-size: 14px; }
.back:hover { color: var(--fg); }

/* árvore */
.home-head { text-align: center; margin-bottom: 8px; }
.home-head h1 { font-size: 30px; }
.home-head p { margin: 0 auto; color: var(--muted); font-size: 14px; }
.home-acts { display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.tree-box { position: relative; margin: 18px auto 0; background-image: radial-gradient(var(--dot) 1.2px, transparent 1.3px); background-size: 22px 22px; border-radius: var(--r-l); }
.tree { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.tree svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.tree path { fill: none; stroke-width: 2; }
.node { position: absolute; width: 176px; box-sizing: border-box; background: var(--raised); border: 1px solid var(--line-strong); border-radius: var(--r-l); padding: 10px 12px; text-align: left; touch-action: none; user-select: none; box-shadow: var(--shadow); }
.node:hover { border-color: var(--fc); }
.node.proj { border-color: color-mix(in oklch, var(--fc) 45%, var(--line-strong)); border-width: 1.5px; }
.node .add { position: absolute; top: -11px; right: -11px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--fc); color: #fff; font-size: 17px; font-weight: 700; line-height: 1; box-shadow: var(--shadow); cursor: pointer; }
.node .add:hover { filter: brightness(1.1); }
.cores { display: flex; gap: 8px; flex-wrap: wrap; }
.cores label { display: block; }
.cores input { position: absolute; opacity: 0; pointer-events: none; }
.cores span { display: block; width: 30px; height: 30px; border-radius: 50%; background: var(--fc); border: 3px solid var(--raised); box-shadow: 0 0 0 1px var(--line-strong); cursor: pointer; }
.cores input:checked + span { box-shadow: 0 0 0 2px var(--fg); }
.cores input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.node.dragging { cursor: grabbing; z-index: 2; }
.node.proj .nm { font-weight: 600; font-size: 14.5px; line-height: 1.3; display: block; }
.node .who { display: flex; align-items: center; gap: 6px; margin-top: 8px; min-height: 30px; }
.node .resp { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); margin-top: 6px; }
/* frente: papel como os projetos, com a cor só na faixa de cima e na bolinha (antes era fundo pastel, que brigava com o papel) */
.node.frente { border-color: color-mix(in oklch, var(--fc) 50%, var(--line-strong)); background: var(--raised); text-align: center; box-shadow: inset 0 4px 0 var(--fc), var(--shadow); padding-top: 14px; }
.node.frente .nm { font-weight: 600; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.node.frente .nm { text-wrap: balance; }
.node.frente .who { justify-content: center; }
.node.frente.open { border-style: dashed; }
.foot-note { text-align: center; margin-top: 18px; font-size: 14px; color: var(--muted); }
.link { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in oklch, var(--accent) 40%, transparent); }

/* projeto */
.chipf { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.chipf::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--fc); }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 500; padding: 1px 9px; border-radius: 99px; background: var(--line); color: var(--muted); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ativo { color: var(--ok); background: color-mix(in oklch, var(--ok) 14%, transparent); }
.pill.feito { color: var(--accent); background: var(--accent-soft); }
.proj-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 22px 0 18px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: none; padding: 8px 14px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; min-height: 40px; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 500; }
.tab .c { font-size: 12px; color: var(--faint); margin-left: 4px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.sec { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 8px; }
.facts { list-style: none; margin: 0 0 22px; padding: 0; display: grid; gap: 10px; }
.facts li { display: grid; grid-template-columns: 120px 1fr; gap: 12px; }
.facts b { font-weight: 500; color: var(--muted); }
.people { display: grid; gap: 8px; }
.person { display: flex; align-items: center; gap: 10px; border: 0; background: none; text-align: left; padding: 4px; border-radius: var(--r-m); width: 100%; }
.person:hover { background: var(--panel); }
.person small { display: block; color: var(--muted); font-size: 12.5px; }
.next { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-l); padding: 12px 14px; margin-bottom: 22px; }
.next p { margin: 0; }
.btn { border: 1px solid var(--line-strong); background: var(--raised); border-radius: var(--r-m); padding: 6px 14px; min-height: 38px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.btn.small { min-height: 32px; padding: 3px 10px; font-size: 13px; }
.field { border: 1px solid var(--line); background: var(--raised); border-radius: var(--r-m); padding: 7px 10px; min-height: 38px; font-size: 16px; box-sizing: border-box; }
textarea.field { width: 100%; min-height: 200px; resize: vertical; line-height: 1.55; font-size: 15px; }
.row-form { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.row-form .field { flex: 1 1 160px; min-width: 0; }
.empty { color: var(--faint); font-size: 14px; margin: 6px 0; }
.task { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.task .t small { display: block; color: var(--faint); font-size: 12.5px; }
.task.done .tt { text-decoration: line-through; color: var(--faint); }
.st { border: 1px solid var(--line); background: var(--raised); border-radius: 99px; font-size: 12.5px; padding: 2px 10px; min-height: 30px; white-space: nowrap; }
.st.fazendo { color: var(--warn); border-color: color-mix(in oklch, var(--warn) 50%, transparent); }
.st.feito { color: var(--ok); border-color: color-mix(in oklch, var(--ok) 50%, transparent); }
.idea { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
.idea .tx { flex: 1; min-width: 0; }
.idea small { display: block; font-size: 12.5px; color: var(--faint); }
.vote { border: 1px solid var(--line); background: var(--raised); border-radius: var(--r-m); min-width: 48px; min-height: 42px; font-size: 13px; color: var(--muted); line-height: 1.1; }
.vote[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.md { font-family: var(--leitura); font-size: 16px; line-height: 1.7; max-width: 68ch; }
.md p { margin: 0 0 12px; } .md ul, .md ol { margin: 0 0 12px; padding-left: 22px; } .md li { margin-bottom: 4px; }
.md h3 { font-family: var(--display); font-weight: 400; font-size: 21px; line-height: 1.25; margin: 26px 0 8px; }
.md blockquote { margin: 0 0 14px; padding: 2px 0 2px 16px; border-left: 3px solid var(--line-strong); color: var(--muted); }
.md blockquote p { margin-bottom: 8px; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
.md a { color: var(--accent); text-underline-offset: 3px; text-decoration-color: color-mix(in oklch, var(--accent) 40%, transparent); overflow-wrap: anywhere; }
.md .tag, .md .wl { font-family: var(--font); font-size: .9em; }
.wl { border: 0; background: none; padding: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in oklch, var(--accent) 40%, transparent); }
.tag { border: 0; color: var(--accent); background: var(--accent-soft); border-radius: var(--r-s); padding: 0 5px; font-size: .92em; }
.notice { font-size: 13.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-m); padding: 8px 12px; }

/* entrada (versão na nuvem) */
.gate { max-width: 440px; margin: 8vh auto 0; text-align: center; }
.gate h1 { font-size: 34px; }
.gate .sela { display: grid; justify-items: center; gap: 6px; margin-bottom: 22px; }
.gate .sela svg { width: 84px; height: 84px; color: var(--anel); }
.gate .sela b { font-family: var(--display); font-weight: 400; font-size: 34px; letter-spacing: .14em; }
.gate .sela i { color: var(--muted); font-size: 14px; }
.gate p { color: var(--muted); }
.gate .form { text-align: left; margin: 18px auto 0; }
.gate .form .field { width: 100%; min-width: 0; box-sizing: border-box; }
.gate .who-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; max-height: 50vh; overflow: auto; text-align: left; margin-top: 12px; }
.gate .who-pick button { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--raised); border-radius: var(--r-m); padding: 6px 8px; font-size: 14px; }
.gate .who-pick button:hover { border-color: var(--accent); }

/* votações */
.polls { display: grid; gap: 8px; max-width: 720px; }
.poll { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-l); padding: 12px 14px; width: 100%; }
.poll:hover { border-color: var(--accent); }
.poll .tx { flex: 1; min-width: 0; }
.poll b { display: block; font-weight: 600; font-size: 15.5px; }
.poll .meta { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
.poll.off { opacity: .7; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 9px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.badge.off { background: var(--line); color: var(--muted); }
.badge.ok { background: color-mix(in oklch, var(--ok) 14%, transparent); color: var(--ok); }
.vhead { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.vhead h1 { flex: 1; min-width: 220px; margin-bottom: 4px; }
.vmeta { font-size: 13.5px; color: var(--muted); margin: 0 0 14px; }
.vsum { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; padding: 10px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); max-width: 640px; }
.vsum span { color: var(--muted); } .vsum b { color: var(--fg); font-weight: 600; }
.opts { display: grid; gap: 6px; margin: 14px 0; max-width: 640px; }
.opt { position: relative; display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: var(--r-m); padding: 10px 12px 12px; background: var(--raised); cursor: pointer; overflow: hidden; }
.opt input { width: 18px; height: 18px; accent-color: var(--accent); margin: 0; flex: none; }
.opt .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); opacity: .55; pointer-events: none; }
.opt .tx { flex: 1; min-width: 0; }
.opt .n { font-size: 13px; color: var(--muted); white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.opt.mine { border-color: var(--accent); }
.opt.win .tx, .opt.win .n { font-weight: 600; color: var(--fg); }
.addop { display: flex; gap: 8px; max-width: 640px; margin-top: 4px; }

.vdet { max-width: 640px; margin-top: 10px; }

.vdet .li span { color: var(--muted); }
.oprow { display: flex; gap: 6px; margin-bottom: 6px; }
.oprow .field { flex: 1; min-width: 0; }

/* integrantes */
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.chip { border: 1px solid var(--line); background: var(--raised); border-radius: 99px; padding: 3px 12px; font-size: 13.5px; min-height: 32px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--fg); }
.members { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.mcard { display: flex; gap: 12px; align-items: center; text-align: left; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-l); padding: 10px 12px; }
.mcard:hover { border-color: var(--accent); }
.mcard b { display: block; font-weight: 600; line-height: 1.3; }
.mcard span.sub { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.35; margin-top: 2px; }
.mcard .none { color: var(--faint); }
.adm { display: inline-block; width: .8em; height: .8em; vertical-align: -.05em; color: var(--c-yellow); }
.adm svg { display: block; width: 100%; height: 100%; fill: currentColor; }

/* perfil */
.prof-head { display: flex; gap: 18px; align-items: center; margin-bottom: 20px; }
.kv { display: grid; grid-template-columns: 210px 1fr; gap: 8px 16px; margin: 0 0 22px; font-size: 14.5px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; }
.form { display: grid; gap: 12px; max-width: 640px; }
.form label { display: grid; gap: 4px; font-size: 13.5px; color: var(--muted); }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.settings { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; border-top: 1px solid var(--line); margin-top: 28px; padding-top: 16px; font-size: 13.5px; color: var(--muted); }

/* calendário (no jeito do Controle Único) */
.seg { display: inline-flex; gap: 4px; background: var(--panel); padding: 4px; border-radius: var(--r-m); border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 6px 16px; border-radius: 6px; }
.seg button[aria-pressed="true"] { background: var(--raised); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.1); font-weight: 600; }
.cbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin: 14px 0; }
.cnav { display: flex; align-items: center; gap: 8px; }
.cnav .btn { min-height: 34px; padding: 4px 10px; }
.cnav .arrow { min-width: 34px; justify-content: center; font-size: 17px; padding: 4px 0; }
.range { font-weight: 700; font-size: 17px; line-height: 1.2; }
.range small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
.gwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--raised); box-shadow: var(--shadow); }
.wk { display: grid; grid-template-columns: 56px repeat(7, minmax(104px, 1fr)); min-width: 780px; }
.gh { position: sticky; top: 0; z-index: 3; background: var(--panel); padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); }
.gh .d { font-size: 11px; letter-spacing: .08em; color: var(--muted); }
.gh .n { font-weight: 700; font-size: 17px; }
.gh.today { background: var(--accent); color: var(--on-accent); } .gh.today .d { color: inherit; opacity: .85; }
.hcol { border-right: 1px solid var(--line); }
.hlab { height: 48px; box-sizing: border-box; border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 600; color: var(--faint); text-align: right; padding: 2px 8px 0 0; }
.trow-lab { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 11px; color: var(--faint); text-align: right; padding: 6px 8px 0 0; background: var(--panel); }
.tcell { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel); padding: 4px; display: flex; flex-direction: column; gap: 3px; min-width: 0; min-height: 30px; }
.dcol { position: relative; border-right: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, transparent 0 47px, var(--line) 47px 48px); cursor: pointer; }
.dcol.fds { background-color: color-mix(in oklch, var(--panel) 60%, transparent); }
.dcol.today::after { content: ""; position: absolute; inset: 0; background: var(--accent); opacity: .05; pointer-events: none; }
.evb { position: absolute; left: 3px; right: 3px; border: 0; border-left: 4px solid var(--fc, var(--accent)); background: color-mix(in oklch, var(--fc, var(--accent)) 16%, var(--raised)); border-radius: var(--r-s); padding: 3px 6px; text-align: left; font-size: 12px; line-height: 1.25; overflow: hidden; color: var(--fg); z-index: 1; }
.evb b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.evb span { color: var(--muted); }
.tchip { border: 0; border-left: 3px solid var(--fc, var(--accent)); background: var(--raised); border-radius: var(--r-s); padding: 3px 6px; text-align: left; font-size: 11.5px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }
.tchip.done { color: var(--faint); text-decoration: line-through; }
.now { position: absolute; left: 0; right: 0; height: 2px; background: var(--bad); z-index: 2; pointer-events: none; }
/* mês igual ao do Controle Único */
.stats { display: flex; gap: 10px; flex-wrap: wrap; }
.stat { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-m); padding: 6px 12px; min-width: 104px; }
.stat b { display: block; font-size: 18px; font-weight: 700; line-height: 1.2; }
.stat span { color: var(--muted); font-size: 12.5px; }
.range::first-letter { text-transform: uppercase; }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.mh { text-align: center; font-size: 11.5px; color: var(--muted); letter-spacing: .06em; padding: 2px 0; }
.mh.fds { color: var(--faint); background: var(--fds-bg); border-radius: 6px; }
.day { background: var(--raised); border: 1px solid var(--line); border-radius: 9px; min-height: 88px; padding: 7px 8px; display: flex; flex-direction: column; gap: 5px; cursor: pointer; min-width: 0; box-sizing: border-box; }
.day:hover { border-color: var(--accent); }
.day.fds { background: var(--fds-bg); border-color: var(--fds-line); }
.day.fds .num { color: var(--faint); font-weight: 400; }
.day.fora { background: transparent; border-style: dashed; opacity: .5; }
.day.hoje { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.day .num { font-weight: 700; font-size: 15px; }
.day .linha { font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; }
.day .linha span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.day .linha.tk { color: var(--accent); }
.dpill { align-self: flex-start; display: inline-flex; align-items: baseline; gap: 5px; background: var(--quente-bg); color: var(--quente-fg); border: 1px solid var(--quente-line); border-radius: 20px; padding: 2px 10px; font-size: 11.5px; font-weight: 600; }
.dpill b { font-weight: 700; font-size: 16px; line-height: 1; }
.dpill.vazio { background: var(--chip); border-color: transparent; color: var(--faint); font-weight: 400; }
.mo { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.mo .dow { font-size: 11px; letter-spacing: .08em; color: var(--muted); padding: 8px; background: var(--panel); border-bottom: 1px solid var(--line); text-align: center; }
.mday { min-height: 104px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px; display: flex; flex-direction: column; gap: 3px; min-width: 0; cursor: pointer; }
.mday:nth-child(7n) { border-right: 0; }
.mday.other { background: var(--panel); }
.mday .n { font-size: 12px; color: var(--muted); padding: 2px 5px; align-self: flex-start; }
.mday.other .n { color: var(--faint); opacity: .7; }
.mday.today .n { background: var(--accent); color: var(--on-accent); border-radius: 99px; font-weight: 700; }
.mchip { border: 0; border-left: 3px solid var(--fc, var(--accent)); background: color-mix(in oklch, var(--fc, var(--accent)) 12%, var(--raised)); border-radius: var(--r-s); padding: 2px 6px; font-size: 11.5px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--fg); }

/* janela de criar e editar */
.modal { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.4); display: grid; place-items: center; padding: 16px; }
.dialog { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow: auto; background: var(--bg); border: 1px solid var(--line-strong); border-radius: var(--r-l); box-shadow: var(--shadow); padding: 20px; box-sizing: border-box; }
.dialog h2 { margin: 0 0 14px; font-size: 20px; }
.pick { display: flex; flex-wrap: wrap; gap: 6px; max-height: 170px; overflow: auto; padding: 2px; }
.pick .chip { padding-left: 3px; }
.pick .av { --s: 24px; border: 0; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: var(--r-m); font-size: 14px; z-index: 40; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.on { opacity: 1; }

/* página do projeto como o Obsidian, notas e tarefas (21/10/2026) */
/* tela limpa (desenho de 21/10/2026, 17h): uma moldura só, coluna da esquerda com os três botões e as notas, e à direita só o que foi aberto.
   Medidas da árvore e da barra da nota tiradas do próprio Obsidian (app.css da versão 1.14.4, lido com o REA): recuo de 12px + 4px com linha guia
   de 1px, item com 4px em cima e embaixo, barra de 40px com o nome da nota no meio. */
.pwrap { display: grid; grid-template-columns: 250px minmax(0, 1fr); margin-top: 12px; align-items: stretch; border: 1px solid var(--line); border-radius: var(--r-l); background: linear-gradient(to right, var(--panel) 0 249px, var(--line) 249px 250px, var(--raised) 250px); min-height: calc(100vh - 150px); }
.pside { padding: 10px 9px 10px 8px; position: sticky; top: 56px; align-self: start; max-height: calc(100vh - 76px); overflow: auto; box-sizing: border-box; }
.pside .back { display: inline-block; margin: 0 0 8px 4px; }
.pfix { display: grid; gap: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.pfix button { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; box-sizing: border-box; background: var(--raised); border: 1px solid var(--line-strong); border-radius: 999px; padding: 6px 12px; font-size: 14px; color: var(--fg); min-height: 34px; }
.pfix button[aria-current="true"] { background: var(--accent-soft); border-color: color-mix(in oklch, var(--accent) 45%, transparent); color: var(--accent); font-weight: 600; }
.pfix button:hover { border-color: var(--accent); }
.pfix .c { font-size: 12px; color: var(--faint); font-weight: 400; }
.ti { display: flex; align-items: center; gap: 6px; width: 100%; box-sizing: border-box; text-align: left; background: none; border: 0; border-radius: var(--r-s); padding: 4px 8px 4px 6px; margin-bottom: 2px; font-size: 14px; line-height: 1.3; color: var(--fg); min-height: 28px; }
.ti.sel { background: var(--accent-soft); color: var(--accent); }
.ti:hover { background: color-mix(in oklch, var(--fg) 7%, transparent); }
.phead { display: flex; align-items: center; justify-content: space-between; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); margin: 12px 4px 6px 6px; }
.phead button { background: none; border: 0; color: var(--muted); font-size: 12.5px; font-weight: 400; padding: 3px 5px; border-radius: var(--r-s); }
.phead button:hover { background: color-mix(in oklch, var(--fg) 7%, transparent); color: var(--fg); }
.tch { margin-left: 12px; padding-left: 4px; border-left: 1px solid color-mix(in oklch, var(--fg) 12%, transparent); }
.ti .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ti .car { display: inline-block; width: 12px; flex: none; color: var(--faint); transition: transform .15s; }
.ti.aberta .car { transform: rotate(90deg); }
.ti.nota { color: var(--muted); padding-left: 24px; }
.ti.nota.sel { color: var(--accent); }
.pmain { min-width: 0; padding: 14px 22px 26px; }
.pcard { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-l); padding: 14px 16px; margin-bottom: 14px; }
.nbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; border: 1px solid var(--line); border-radius: var(--r-m); padding: 5px 6px 5px 12px; min-height: 40px; box-sizing: border-box; margin-bottom: 18px; }
.nbar .ncam { font-size: 13px; color: var(--faint); }
.nbar .nnome { font-size: 15px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nbar .esp { flex: 1; }
.ler { max-width: 720px; margin: 0 auto; }
.ntitle { font-size: 24px; margin: 0 0 12px; }
/* escopo do projeto: o nome no meio, os campos em lista e a trilha de documentos */
.esc-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.esc-top .esp { flex: 1; }
.esc-nome { text-align: center; margin: 14px 0 18px; font-size: 30px; }
.campos { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 9px 16px; margin: 0; }
.campos dt { color: var(--muted); font-size: 14px; padding-top: 2px; }
.campos dd { margin: 0; font-size: 15px; }
.campos .vazio { color: var(--faint); }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { display: inline-flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px 2px 2px; font-size: 13.5px; color: var(--fg); }

.docs-h { display: flex; align-items: center; gap: 8px; margin: 26px 0 10px; }
.docs-h h2 { margin: 0; }

.doc { position: relative; display: flex; flex-direction: column; gap: 6px; width: 170px; box-sizing: border-box; text-align: left; background: none; border: 0; padding: 0; color: var(--fg); }
.doc .pg { position: relative; display: block; width: 100%; aspect-ratio: 1 / 1.414; overflow: hidden; background: #fff; border: 1px solid var(--line-strong); border-radius: var(--r-s); box-shadow: 0 1px 0 var(--line), 3px 3px 0 -1px var(--panel), 3px 3px 0 0 var(--line); }
.doc:hover .pg { border-color: var(--accent); }
.doc .pg img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.doc .pg .ptx { display: block; padding: 10px 9px; font-size: 6.5px; line-height: 1.45; color: #333; overflow: hidden; height: 100%; box-sizing: border-box; white-space: pre-line; }
.doc .pg .ptx b { display: block; font-size: 9px; margin-bottom: 4px; color: #111; }
.doc .pg .vz { position: absolute; inset: 0; display: grid; place-items: center; color: #999; font-weight: 600; font-size: 13px; }
.doc + .doc::before { content: ""; position: absolute; left: -27px; top: 40%; width: 26px; border-top: 1px solid var(--line-strong); }
.doc .num { position: absolute; right: -10px; top: calc(170px * 1.414 - 18px); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--raised); border: 1px solid var(--line-strong); font-size: 13px; font-weight: 600; }
.doc .dt { font-weight: 600; font-size: 14px; line-height: 1.3; }
.doc small { color: var(--faint); font-size: 12px; }
.doc.novo { min-height: 150px; padding: 14px; border: 1px dashed var(--line-strong); border-radius: var(--r-m); border-style: dashed; box-shadow: none; color: var(--muted); justify-content: center; align-items: center; text-align: center; }
.folha { background: #fff; color: #1d1d1f; max-width: 760px; margin: 0 auto; padding: 46px 54px; box-sizing: border-box; border-radius: 4px; box-shadow: 0 2px 14px rgba(0,0,0,.18); min-height: 60vh; }
.folha .md, .folha h1, .folha h3 { color: #1d1d1f; }
.folha .md a, .folha .wl { color: #6E1E2B; text-decoration-color: rgba(110,30,43,.35); }
.folha .md blockquote { color: #55504a; border-left-color: #d6cdbd; } .folha .md hr { border-top-color: #e2dccf; }
.folha .tag { color: #6E1E2B; background: rgba(110,30,43,.08); }
.folha .fcab { font-size: 12px; color: #6e6e73; border-bottom: 1px solid #ddd; padding-bottom: 8px; margin-bottom: 22px; }
.folha h1 { font-size: 26px; margin: 0 0 16px; }
.pdfbox { width: 100%; height: 78vh; border: 1px solid var(--line); border-radius: var(--r-m); background: #fff; }
@media print { body * { visibility: hidden; } .folha, .folha * { visibility: visible; } .folha { position: absolute; left: 0; top: 0; box-shadow: none; max-width: none; width: 100%; } }
.ntit { font-size: 20px; font-weight: 600; width: 100%; box-sizing: border-box; margin-bottom: 8px; }
.nmove { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.nmove .field { font-size: 13px; }
.ntxt { width: 100%; box-sizing: border-box; min-height: 52vh; font-family: ui-monospace, Consolas, monospace; font-size: 14px; line-height: 1.6; resize: vertical; }
.nmeta { font-size: 12.5px; color: var(--faint); margin-top: 14px; }
.md li.ck { list-style: none; margin-left: -18px; }
.task button.t { background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit; cursor: pointer; min-width: 0; }
.task button.t:hover .tt { text-decoration: underline; text-decoration-color: var(--line-strong); }
.li button.tx { background: none; border: 0; padding: 0; text-align: left; color: inherit; font: inherit; cursor: pointer; }
.task .late { color: var(--bad); font-weight: 600; }
.prio { font-size: 13px; }
/* online, sala agora, início e conversa (21/10/2026) */
.av { overflow: visible; position: relative; }
.av img { border-radius: 50%; }
.av.on::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: max(9px, calc(var(--s) * .3)); height: max(9px, calc(var(--s) * .3)); border-radius: 50%; background: var(--c-green); border: 2px solid var(--bg); box-sizing: border-box; }
.agora { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; max-width: 1200px; margin: 0 auto; padding: 10px 16px 0; font-size: 14px; color: var(--muted); }
.agora:empty { display: none; }
.agora .live { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; width: 100%; box-sizing: border-box; background: color-mix(in oklch, var(--c-green) 12%, transparent); border: 1px solid color-mix(in oklch, var(--c-green) 40%, transparent); color: var(--fg); border-radius: var(--r-m); padding: 8px 12px; }
.agora .pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--c-green); flex: none; }
.agora .esp { flex: 1; }
a.btn { text-decoration: none; color: inherit; }
a.btn.primary { color: var(--on-accent); }
.home-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 18px auto 0; max-width: 1100px; }
.card { background: var(--raised); border: 1px solid var(--line); border-radius: var(--r-l); padding: 12px 14px; min-width: 0; }
.card h2 { font-size: 15px; margin: 0 0 6px; }
.home-head { position: relative; }
.novbtn { position: absolute; right: 0; top: 0; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--raised); border-radius: 99px; padding: 3px 12px; min-height: 32px; font-size: 13px; color: var(--muted); }
.novbtn:hover, .novbtn[aria-expanded="true"] { border-color: var(--accent); color: var(--fg); }

function esperarAcesso(uid) {
  if (NV.espera) return;

    const a = s.exists ? s.data() : null; if (!a) return telaCodigo();
    if (a.bloqueado) return telaSemAcesso(); if (a.ok === false) return telaEspera();
    NV.espera(); NV.espera = null; NV.acesso = a; assinar();
  }, () => telaEspera());
}
async function entrarNuvem() {

    const ref = NV.db.collection("acessos").doc(u.uid);
    const snap = await ref.get().catch(() => null);
    if (!snap || !snap.exists) return telaCodigo();
    const a = snap.data();

}
function assinar() {
  S = { versao: SEED.versao, membros: [], frentes: [], projetos: [], eventos: [], votacoes: [], mensagens: [], notas: [], pessoal: { tarefas: [] }, lixo: [] }; NV.prontos = 0;
  NV.db.collection("notas").onSnapshot(snap => { S.notas = snap.docs.map(d => volta(d.data())).concat(S.notas.filter(n => n.dono)); NV.notasOk = true; tentarMigrar(); agendarRender(); }, () => {});
  /* a conversa e o online ficam fora do salvamento geral: cada mensagem e cada sinal é um documento próprio */
  NV.db.collection("mensagens").orderBy("em", "desc").limit(300).onSnapshot(snap => { S.mensagens = snap.docs.map(d => d.data()); if (UI.v === "projeto" && UI.tab === "conversa") renderChat(); else if (UI.v === "inicio") agendarRender(); }, () => {});
  NV.db.collection("online").onSnapshot(snap => { snap.docs.forEach(d => ON[d.id] = d.data().t || 0); marcarOnline(); }, () => {});
  for (const c of COLS) NV.db.collection(c).onSnapshot(snap => {
    S[c] = snap.docs.map(d => volta(d.data())).sort((a, b) => (a.ordem || 0) - (b.ordem || 0));
    /* projeto excluído vai para a lixeira (campo excluido) e sai das telas; o ADM restaura */
    if (c === "projetos") { S.lixo = S.projetos.filter(p => p.excluido); S.projetos = S.projetos.filter(p => !p.excluido); }
    for (const k of Object.keys(NV.last)) if (k.startsWith(c + "/")) delete NV.last[k];
    S[c].forEach(x => NV.last[c + "/" + x.id] = JSON.stringify(x));
    if (NV.prontos < COLS.length) { NV.prontos++; if (NV.prontos === COLS.length) pronto(); return; }
    agendarRender();
  }, () => telaCodigo("Sem acesso ao banco. Confira o código."));

function assinarPessoal(me) {
  if (NV.pessoal === me) return; NV.pessoal = me;
  NV.db.collection("pessoal").where("dono", "==", me).onSnapshot(snap => {
    const ds = snap.docs.map(d => volta(d.data())), tk = ds.find(d => d.tipo === "tarefas");
    S.pessoal.tarefas.splice(0, S.pessoal.tarefas.length, ...((tk && tk.lista) || []));

    S.notas = S.notas.filter(n => !n.dono).concat(ds.filter(d => d.tipo === "nota" || d.tipo === "pasta"));
    agendarRender();

function tentarMigrar() { if (!NV.migrou && NV.notasOk && NV.prontos >= COLS.length) { NV.migrou = true; migrarNotas(); } }
function pronto() {

const editando = () => !!$("#overlay").innerHTML || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && document.activeElement.closest("#screen")) || UI.edit || !!UI.ren || !!ARR || !!(REDE && (REDE.drag || REDE.pan));

function gravarNuvem() {
  const batch = NV.db.batch(); let n = 0;
  for (const c of COLS) {
    const ids = new Set();
    S[c].forEach((x, i) => {
      if (x.ordem == null) x.ordem = Date.now() + i;
      const k = c + "/" + x.id, j = JSON.stringify(x); ids.add(k);
      if (NV.last[k] === j) return;
      const ref = NV.db.collection(c).doc(x.id);
      if (NV.last[k]) {
        /* grava só os campos que esta pessoa mudou: se um colega mexeu em outro campo do mesmo projeto ao mesmo tempo, a mudança dele fica.
           Voto de cada um vai só no campo dele, para dois votos ao mesmo tempo não se apagarem. */
        const old = JSON.parse(NV.last[k]), upd = {};
        for (const f of new Set([...Object.keys(old), ...Object.keys(x)])) if (!(c === "votacoes" && f === "votos") && JSON.stringify(x[f]) !== JSON.stringify(old[f])) upd[f] = x[f] === undefined ? firebase.firestore.FieldValue.delete() : ida(x[f]);
        if (c === "votacoes") { const ks = new Set([...Object.keys(old.votos || {}), ...Object.keys(x.votos || {})]);
          for (const m of ks) if (JSON.stringify((x.votos || {})[m]) !== JSON.stringify((old.votos || {})[m])) upd["votos." + m] = (x.votos || {})[m] ? x.votos[m] : firebase.firestore.FieldValue.delete(); }
        if (Object.keys(upd).length) { batch.update(ref, upd); n++; }
      } else { batch.set(ref, ida(JSON.parse(j))); n++; }
      NV.last[k] = j;
    });
    for (const k of Object.keys(NV.last)) if (k.startsWith(c + "/") && !ids.has(k)) { batch.delete(NV.db.collection(c).doc(k.slice(c.length + 1))); delete NV.last[k]; n++; }
  }
  if (n) batch.commit().catch(e => toast("Não consegui salvar: " + e.message));
  const eu = JSON.stringify(S.pessoal.tarefas);
  if (NV.pessoal && eu !== NV.lastEu) { NV.lastEu = eu; NV.db.collection("pessoal").doc("t-" + NV.pessoal).set(ida({ id: "t-" + NV.pessoal, dono: NV.pessoal, tipo: "tarefas", lista: JSON.parse(eu) })).catch(e => toast("Não consegui salvar na sua área: " + e.message)); }
}

/* tela Tarefas: as minhas (com as da minha área), as sem responsável ou as do clube todo; agrupadas por prazo, como no Todoist, ou por projeto */
function tarefasHTML() {
  const hoje = hojeISO(), sem = ymd(addD(new Date(), 7)), tf = UI.tf || (UI.tf = { quem: "eu", q: "abertas", por: "prazo" });
  const base = tf.quem === "eu" ? S.projetos.concat([EU()]) : S.projetos;
  const todas = base.flatMap(p => p.tarefas.map((t, i) => ({ t, i, p }))).filter(x => tf.quem === "todos" || (tf.quem === "sem" ? !x.t.quem : x.p.eu || x.t.quem === UI.me));
  const F_ = { abertas: x => x.t.st !== "feito", atrasadas: x => x.t.st !== "feito" && x.t.prazo && x.t.prazo < hoje, hoje: x => x.t.st !== "feito" && x.t.prazo === hoje,
    semana: x => x.t.st !== "feito" && x.t.prazo && x.t.prazo >= hoje && x.t.prazo <= sem, semprazo: x => x.t.st !== "feito" && !x.t.prazo, feitas: x => x.t.st === "feito" };
  const NOMES = [["abertas", "Abertas"], ["atrasadas", "Atrasadas"], ["hoje", "Hoje"], ["semana", "Próximos 7 dias"], ["semprazo", "Sem prazo"], ["feitas", "Feitas"]];
  const lista = todas.filter(F_[tf.q]).sort((a, b) => tf.q === "feitas" ? (b.t.feitoEm || 0) - (a.t.feitoEm || 0) : ordTarefa(a.t, b.t));
  const sec = (tit, l, cls, comProj) => l.length ? `<div class="tsec${cls ? " " + cls : ""}">${tit}<span class="n">${l.length}</span></div><div class="tlist">${l.map(x => tarefaHTML(x.t, x.p, x.i, comProj)).join("")}</div>` : "";
  let corpo;
  if (tf.q === "feitas") corpo = sec("Feitas, das mais recentes", lista, "", true);

/* ===== CALENDÁRIO ===== */
const H0 = 7, H1 = 22, HH = 48;
const inicioSemana = d => addD(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -d.getDay());
const corEv = e => { const p = P(e.proj); return fc(p ? F(p.frente) : null); };
function ocorrencias(de, ate) {
  const out = [];
  for (const e of S.eventos) {
    if (!e.semanal) { if (e.data >= de && e.data <= ate) out.push({ e, d: e.data }); continue; }
    for (let d = new Date(e.data + "T12:00"); ymd(d) <= ate; d = addD(d, 7)) if (ymd(d) >= de) out.push({ e, d: ymd(d) });
  }
  return out;
}
const tarefasEm = d => S.projetos.concat([EU()]).flatMap(p => p.tarefas.map((t, i) => ({ ...t, i, p }))).filter(t => t.prazo === d);
const mins = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
function calHTML() {
  const ref = UI.ref ? new Date(UI.ref + "T12:00") : new Date(); const hoje = ymd(new Date());
  let range, sub, body, stats = "";
  if (UI.cal === "semana") {
    const s = inicioSemana(ref), e = addD(s, 6), dias = [...Array(7)].map((_, i) => addD(s, i));
    range = `${s.getDate()} de ${MESES[s.getMonth()]} a ${e.getDate()} de ${MESES[e.getMonth()]}`; sub = dias.some(d => ymd(d) === hoje) ? "semana atual" : "semana de " + e.getFullYear();
    const occ = ocorrencias(ymd(s), ymd(e)); const agora = new Date();
    body = `<div class="gwrap"><div class="wk"><div class="gh"></div>${dias.map(d => `<div class="gh${ymd(d) === hoje ? " today" : ""}"><div class="d">${DIAS[d.getDay()]}</div><div class="n">${d.getDate()}</div></div>`).join("")}
      <div class="trow-lab">Tarefas</div>${dias.map(d => `<div class="tcell">${tarefasEm(ymd(d)).map(t => `<button class="tchip${t.st === "feito" ? " done" : ""}" style="--fc:${fc(F(t.p.frente))}" data-act="edtarefa" data-p="${t.p.id}" data-i="${t.i}" title="${esc(t.t)} (${esc(t.p.nome)})">${esc(t.t)}</button>`).join("")}</div>`).join("")}
      <div class="hcol">${[...Array(H1 - H0)].map((_, i) => `<div class="hlab">${pad(H0 + i)}h</div>`).join("")}</div>
      ${dias.map(d => { const k = ymd(d); return `<div class="dcol${k === hoje ? " today" : ""}${d.getDay() % 6 === 0 ? " fds" : ""}" data-act="newat" data-date="${k}" style="height:${(H1 - H0) * HH}px">
        ${occ.filter(o => o.d === k).map(o => { const top = (mins(o.e.ini) - H0 * 60) / 60 * HH, hgt = Math.max(26, (mins(o.e.fim || o.e.ini) - mins(o.e.ini)) / 60 * HH - 2);
          return `<button class="evb" data-act="ev" data-id="${o.e.id}" style="top:${top}px;height:${hgt}px;--fc:${corEv(o.e)}"><b>${esc(o.e.titulo)}</b><span>${o.e.ini}${o.e.fim ? "–" + o.e.fim : ""}</span></button>`; }).join("")}
        ${k === hoje && agora.getHours() >= H0 && agora.getHours() < H1 ? `<span class="now" style="top:${(agora.getHours() * 60 + agora.getMinutes() - H0 * 60) / 60 * HH}px"></span>` : ""}</div>`; }).join("")}
    </div></div>`;
  } else {
    /* o mês do Controle Único: um cartão por dia, a etiqueta com quantos compromissos e os horários embaixo; clicar abre a semana */
    const first = new Date(ref.getFullYear(), ref.getMonth(), 1), s = inicioSemana(first), dias = [...Array(42)].map((_, i) => addD(s, i));
    range = `${MESES[ref.getMonth()]} de ${ref.getFullYear()}`; sub = "";
